[project]
name = "biodry-backend"
version = "0.1.0"
description = "Local FastAPI and PostgreSQL service for BioDry research workflows"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17,<2",
  "fastapi>=0.121,<1",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.11,<3",
  "sqlalchemy>=2.0.44,<2.1",
  "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

